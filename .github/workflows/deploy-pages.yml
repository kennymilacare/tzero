name: Deploy site to GitHub Pages

# The site is plain static files — there is nothing to build, so "deploying"
# means publishing the repository as-is. Every push publishes, including the
# automated commit made by the Facebook sync workflow.
#
# If the site is hosted somewhere else (Netlify, Vercel, Cloudflare Pages),
# delete this file and connect that host to the repository instead.

on:
  push:
    branches: [main]
  # The sync workflow commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not start a new workflow run for a push made that way
  # — so the "push" trigger above would never fire for it. workflow_run is
  # the documented way to catch those commits. It runs on the default
  # branch, which already contains the synced feed by then.
  workflow_run:
    workflows: ['Sync Facebook news']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed sync shouldn't publish a half-written feed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # Always publish the default branch, whichever event fired.
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare the site
        run: |
          # Only the site itself is published — not the git history or the
          # workflow definitions.
          rm -rf .git .github .tmp-test
          rm -f screenshots/*.png

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
