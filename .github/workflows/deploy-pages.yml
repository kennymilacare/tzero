name: Deploy site to GitHub Pages

# The site is plain static files — there is nothing to build, so "deploying"
# means publishing the repository as-is. Every push publishes, including the
# automated commit made by the Facebook sync workflow.
#
# If the site is hosted somewhere else (Netlify, Vercel, Cloudflare Pages),
# delete this file and connect that host to the repository instead.

on:
  push:
    branches: [main]
  # The sync workflow commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not start a new workflow run for a push made that way
  # — so the "push" trigger above would never fire for it. workflow_run is
  # the documented way to catch those commits. It runs on the default
  # branch, which already contains the synced feed by then.
  #
  # The name below must match the workflow's `name:` exactly, or the
  # handoff silently stops happening.
  workflow_run:
    workflows: ['Sync Instagram news']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed sync shouldn't publish a half-written feed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # Always publish the default branch, whichever event fired.
          ref: ${{ github.event.repository.default_branch }}
          # The sitemap's lastmod is the day a page was last changed,
          # which means reading the git history. A shallow checkout
          # cannot answer that, so take the whole history.
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Refresh the generated pages
        run: |
          # The product pages, the FAQ block, the structured data, the
          # English and Japanese pages and the sitemap are all written
          # from files that are already in the repository. Running the
          # generators here means what goes live is never out of date,
          # even if a commit forgot to run them.
          #
          # The order matters: the language pages are made from the
          # product pages and the structured data, so they come last.
          node scripts/gen-product-pages.mjs
          node scripts/gen-faq-html.mjs
          node scripts/gen-jsonld.mjs
          node scripts/gen-lang-pages.mjs
          node scripts/update-sitemap.mjs

          # The IndexNow key file. The search engine fetches it from
          # the site root over HTTP, so it has to be there when the
          # site goes out — and it is built rather than committed, so
          # it can never drift from the key it is made of.
          node scripts/indexnow.mjs --write

      - name: Prepare the site
        run: |
          # Only the site itself is published — not the git history, the
          # workflow definitions, the internal docs, the scripts, or the
          # editor's own settings. Everything under /assets/ IS published:
          # the pages need the CSS and the JavaScript to render at all.
          rm -rf .git .github .claude .tmp-test .tmp-verify docs scripts
          rm -f screenshots/*.png README.md .gitignore package.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Say "these pages changed" to the search engines that can be told
  # without an account.
  #
  # IndexNow is a small POST to a public endpoint — Bing and Yandex
  # read it. It runs in its own job because the deploy job deletes the
  # scripts folder before publishing, and because the addresses have to
  # be live before anyone is told to fetch them.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The last commit and the one before it — that is all it
          # takes to work out what changed.
          fetch-depth: 2

      - name: Tell the search engines
        run: node scripts/indexnow.mjs --changed
