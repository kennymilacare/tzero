name: Sync Instagram news

# Pulls the latest posts from the T-ZERO Instagram Business account and
# commits them to assets/data/news.json plus the post images. The site reads
# that file at runtime, so a push here is all it takes to publish a new post.
#
# The Facebook Page's own posts are NOT synced — FB_INCLUDE_FB=0 stops the
# script asking for them. The Page is still used to find the Instagram
# account, because that is how Meta links the two.
#
# Setup: see docs/instagram-sync.md. The secrets below must be added under
# Settings -> Secrets and variables -> Actions.
#
# The schedule is OFF on purpose. The Graph API route needs a Meta App and
# a token, and none is set up — so a scheduled run would only fail twice a
# day. The feed is updated the other way for now:
#
#     node scripts/ig-fetch.mjs --latest && node scripts/manual-post.mjs
#
# which uses the Instagram session saved in .ig-profile/. That session
# holds cookies and can never be committed to a public repository, so it
# cannot run here in Actions. Re-enable the cron below if the token is
# ever set up.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # The commit step rebases onto the branch before pushing, and a
          # shallow clone can't rebase. Fetch the whole history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull the latest Instagram posts
        env:
          # Instagram only. The Facebook Page feed is not read at all.
          FB_INCLUDE_FB: '0'
          # FB_USER_TOKEN is the one the setup guide asks for — the script
          # exchanges it for a Page token, and uses that to look up the
          # Instagram account. FB_PAGE_TOKEN is an alternative for anyone who
          # already has one.
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          # App id + secret let the script renew the token on every run.
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_USERNAME: ${{ vars.FB_PAGE_USERNAME }}
          FB_IG_USERNAME: ${{ vars.FB_IG_USERNAME }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
        run: node scripts/sync-facebook.mjs

      - name: Commit the updated feed
        run: |
          if [ -z "$(git status --porcelain -- assets/data/news.json assets/images/news)" ]; then
            echo "No changes — the feed has not moved since the last run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data/news.json assets/images/news
          git commit -m "chore: sync Instagram news"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
